<title id="db-light-title">Dawnbringer: Godot 4.5 architecture</title>
<desc id="db-light-desc">Four zones, left to right: data and localization (JSON content and CSV catalogs), a deterministic RefCounted rules core in game/core/, the Votive Gothic 2x renderer with procedural audio, and edge services with export presets for five target platforms. A six-layer verification pipeline runs underneath all four.</desc>
