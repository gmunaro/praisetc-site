<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="os-d-title os-d-desc" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <title id="os-d-title">OpenStrut V2: software architecture and structural calculation pipeline</title>
  <desc id="os-d-desc">Four connected stages. 01 Input and importers, local-first: SVG floor plan editor, .openstrut.json project file with IndexedDB draft, SISTRUT 1991 parser, optional Google Drive import. 02 Pure calculation engine in src/calculo with zero React: domain geometry from slabs to beams to columns, then one of two design codes, NBR 6118:2023 or NB-1/78 in dual mode (original with QuickBASIC Float32 parity, corrigido in Float64 and SI units). 03 Detailing and oracles: rebar detailing, equilibrium and code warnings. 04 Client-side outputs with no server: 3D, 4D, AR and pathtracer viewer, zero-dependency IFC4 STEP writer, DXF R12 export, calculation memory and report. A verification bar lists 268 TS/TSX application files, 187 Vitest unit and UI test files, 40 Playwright end-to-end files and the independent oracles Bastos (UNESP), DOSBox-X running the 1991 binary, and IfcOpenShell.</desc>
